name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Quickstart smoke test
        run: python examples/quickstart.py
      - name: Eval demo smoke test
        run: python -m budgetrouter.eval --demo
      - name: Agent workload demo smoke test
        run: python examples/agent_workload_demo.py
      - name: LangGraph example smoke test
        run: python examples/langgraph_example.py
