[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetrouter"
version = "0.1.0"
description = "Lightweight multi-model routing for LLM/agent apps: routing rules, fallback chains, and budget gates, plus a tiny eval runner."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sen Yang" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
